<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Textile Stock Prediction</title>
    <link rel="stylesheet" href="/static/style.css">



</head>


<body>

    <div class="container">

        <h1>Stock Prediction</h1>

        <p class="subtitle">
            Textile Inventory Management System
        </p>


        <form id="predictionForm">

            <!-- Category -->

            <div class="input-group">

                <label>Category</label>

                <select id="category" required>

                    <option value="">Select Category</option>

                    <option value="Kids Wear">
                        Kids Wear
                    </option>

                    <option value="T-Shirt">
                        Kurti
                    </option>

                    <option value="Traditional Wear">
                        Traditional Wear
                    </option>

                    <option value="Women's Wear">
                        Women's Wear
                    </option>

                    <option value="Men's Wear">
                        Men's Wear
                    
                    <option value="Men's Wear">
                        T-Shirt

                    <option value="Men's Wear">
                        Saree

                    <option value="Men's Wear">
                        Shirt
                    </option>

                </select>

            </div>


            <!-- Current Stock -->

            <div class="input-group">

                <label>Current Stock</label>

                <input
                    type="number"
                    id="current_stock"
                    min="0"
                    placeholder="Enter current stock"
                    required
                >

            </div>


            <!-- Units Sold -->

            <div class="input-group">

                <label>Units Sold Last 7 Days</label>

                <input
                    type="number"
                    id="units_sold"
                    min="0"
                    placeholder="Enter units sold"
                    required
                >

            </div>


            <button type="submit">
                Predict
            </button>

        </form>


        <!-- Result -->

        <div id="result">

            <div class="prediction" id="prediction"></div>

            <div id="details"></div>

        </div>

    </div>


    <script>

        document
        .getElementById("predictionForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const category =
                document.getElementById("category").value;

            const current_stock =
                document.getElementById("current_stock").value;

            const units_sold =
                document.getElementById("units_sold").value;


            const resultBox =
                document.getElementById("result");

            const prediction =
                document.getElementById("prediction");

            const details =
                document.getElementById("details");


            resultBox.style.display = "block";

            prediction.innerHTML = "Predicting...";

            details.innerHTML = "";


            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        category: category,

                        current_stock: current_stock,

                        units_sold: units_sold

                    })

                });


                const data = await response.json();


                prediction.innerHTML =
                    data.result;


               


            }

            catch(error) {

                prediction.innerHTML =
                    "Error connecting to server.";

                console.log(error);

            }

        });

    </script>

</body>

</html>
