<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Stress Predictor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .predict-btn {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #5568d8;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f5f7ff;
            border-radius: 15px;
            text-align: center;
        }

        .result h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .stress-level {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .probability {
            margin: 10px 0;
            text-align: left;
        }

        .probability-bar {
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .probability-fill {
            height: 100%;
            width: 0%;
            background: #667eea;
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎓 Student Stress Predictor</h1>

    <p class="subtitle">
        ML-Based Student Stress Level Prediction
    </p>


    <form action="/predict" method="POST">

        <div class="form-grid">

            <div class="input-group">

                <label>
                    Academic Pressure Score
                </label>

                <input
                    type="number"
                    name="academic_pressure_score"
                    min="1"
                    max="10"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Anxiety Score
                </label>

                <input
                    type="number"
                    name="anxiety_score"
                    min="1"
                    max="10"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Depression Score
                </label>

                <input
                    type="number"
                    name="depression_score"
                    min="1"
                    max="10"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Social Support Score
                </label>

                <input
                    type="number"
                    name="social_support_score"
                    min="1"
                    max="10"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Daily Screen Time (Hours)
                </label>

                <input
                    type="number"
                    step="0.1"
                    name="screen_time_hours"
                    min="0"
                    max="24"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Daily Sleep (Hours)
                </label>

                <input
                    type="number"
                    step="0.1"
                    name="daily_sleep_hours"
                    min="0"
                    max="24"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Attendance Percentage
                </label>

                <input
                    type="number"
                    step="0.1"
                    name="attendance_percentage"
                    min="0"
                    max="100"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    CGPA
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="cgpa"
                    min="0"
                    max="10"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="predict-btn">
            🔍 Predict Stress Level
        </button>

    </form>


    {% if prediction %}

    <div class="result">

        <h2>Prediction Result</h2>

        <div class="stress-level">
            Predicted Stress Level:
            {{ prediction }}
        </div>


        <h3>Prediction Probabilities</h3>


        {% for item in probabilities %}

        <div class="probability">

            <strong>
                {{ item.class_name }}
            </strong>

            - {{ item.probability }}%

            <div class="probability-bar">

                <div
                    class="probability-fill"
                    style="width: {{ item.probability }}%;"
                ></div>

            </div>

        </div>

        {% endfor %}

    </div>

    {% endif %}

</div>

</body>

</html>
